name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Preuzmi repozitorij
        uses: actions/checkout@v4

      - name: Postavi Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Namjerno se NE instalira scrapers/requirements.txt u cijelosti.
      # Taj popis povlaci torch (oko 800 MB) i sentence-transformers, sto je
      # potrebno samo za vektor.py. Testovi ne smiju trebati ni torch ni mrezu,
      # pa se instaliraju samo lagane ovisnosti.
      - name: Instaliraj lagane ovisnosti
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests beautifulsoup4 lxml

      - name: Pokreni testove
        run: python -m unittest discover -s tests -v
